<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>体細胞分裂マスター</title>
    <link rel="stylesheet" href="css/style.css?v=20261124-3">
</head>
<body>

<!-- ホーム画面 -->
<div id="home-screen" class="screen active">
    <div class="start-card">
        <!-- 学習モード切替タブ（上部） -->
        <div class="category-switcher" role="tablist" aria-label="学習モード選択">
            <button
                type="button"
                id="tab-cycle"
                class="category-tab active"
                role="tab"
                aria-selected="true"
                data-category="cycle"
            >
                <span>🔄 細胞周期で覚える</span>
                <span class="tab-score" id="tab-score-cycle" hidden></span>
            </button>
            <button
                type="button"
                id="tab-sketch"
                class="category-tab"
                role="tab"
                aria-selected="false"
                data-category="sketch"
            >
                <span>🔬 細胞スケッチで覚える</span>
                <span class="tab-score" id="tab-score-sketch" hidden></span>
            </button>
        </div>

        <h1>体細胞分裂マスター 🔬</h1>
        <p class="desc" id="home-desc">
            カードを選んで、細胞周期の図（G₁・S・G₂・M・間期・分裂期・前期〜終期）の正しい位置に当てはめよう！
        </p>

        <div class="rules" id="home-rules">
            <div class="rule-item">
                <span class="rule-icon">🔰</span>
                <div><b>かんたん</b>：ヒントと色分けが表示されます</div>
            </div>
            <div class="rule-item">
                <span class="rule-icon">🧪</span>
                <div><b>ふつう</b>：ヒント・色が消滅！文字や白黒スケッチだけで判別するモード</div>
            </div>
            <div class="rule-item" id="rule-oni-item" hidden>
                <span class="rule-icon">👹</span>
                <div id="rule-oni-text"><b>おに</b>：60秒タイムアタック（ミスで-5秒）！無限に出題されます</div>
            </div>
        </div>

        <div class="mode-buttons">
            <button type="button" class="mode-btn btn-easy" data-difficulty="easy">🔰 かんたんでスタート</button>
            <button type="button" class="mode-btn btn-normal" data-difficulty="normal">🧪 ふつうでスタート</button>
            <button type="button" class="mode-btn btn-oni" id="btn-oni" data-difficulty="oni" hidden>👹 おにでスタート</button>
        </div>
    </div>
</div>

<!-- ゲーム画面 -->
<div id="game-screen" class="screen">
    <header class="header">
        <button type="button" class="reset-btn" id="home-btn">
            <span class="reset-icon">🏠</span> ホーム
        </button>

        <div class="progress-container" id="progress-container">
            <div class="timer-badge" id="timer-badge" hidden>⏱️ <span id="timer-text">60</span>秒</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="score-text" id="score-text"><span id="score">0</span>/<span id="total-questions">10</span></div>
        </div>

        <div class="mode-display" id="mode-display">🔄 細胞周期 / 🔰 かんたん</div>
    </header>

    <main class="main">
        <section class="graph-container">
            <div class="graph-wrapper" id="graph-wrapper">
                <!-- 細胞周期（間期：G1・S・G2 ＋ M期／分裂期：前期・中期・後期・終期） -->
                <svg
                    id="cycle-svg"
                    viewBox="0 0 680 540"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="細胞周期と体細胞分裂の模式図"
                >
                    <defs>
                        <marker id="arrow-slate" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748B" />
                        </marker>
                        <marker id="arrow-teal" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0D9488" />
                        </marker>
                    </defs>

                    <!-- ======== 左側：細胞周期リング (中心 215, 275 / 半径 145) ======== -->
                    <!-- 間期エリアの淡い背景扇形 (G1〜S〜G2) -->
                    <path
                        d="M 215 275 L 318 378 A 145 145 0 1 1 318 172 Z"
                        fill="#F0F9FF"
                        stroke="#BAE6FD"
                        stroke-width="2"
                        stroke-dasharray="5 4"
                    />
                    <!-- M期エリアの淡い背景扇形 -->
                    <path
                        d="M 215 275 L 318 172 A 145 145 0 0 1 318 378 Z"
                        fill="#F0FDFA"
                        stroke="#99F6E4"
                        stroke-width="2"
                    />

                    <!-- 円周ガイドリング -->
                    <circle cx="215" cy="275" r="145" fill="none" stroke="#CBD5E1" stroke-width="12" opacity="0.55" />

                    <!-- 時計回りの進行矢印 -->
                    <!-- スタート(右下) → G1期(下) -->
                    <path d="M 315 380 A 145 145 0 0 1 268 410" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-teal)" />
                    <!-- G1期(下) → S期(左) -->
                    <path d="M 155 407 A 145 145 0 0 1 78 326" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#arrow-slate)" />
                    <!-- S期(左) → G2期(上) -->
                    <path d="M 78 224 A 145 145 0 0 1 155 143" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#arrow-slate)" />
                    <!-- G2期(上) → M期(右) -->
                    <path d="M 272 142 A 145 145 0 0 1 346 216" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#arrow-slate)" />
                    <!-- M期(右) → スタート(右下) -->
                    <path d="M 350 330 A 145 145 0 0 1 322 372" fill="none" stroke="#0D9488" stroke-width="3.5" marker-end="url(#arrow-teal)" />

                    <!-- 周期の起点マーカー（分裂完了・スタート） -->
                    <g transform="translate(338, 405)">
                        <rect x="-56" y="-14" width="112" height="26" rx="13" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8" />
                        <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0E7490">分裂直後・スタート↻</text>
                    </g>

                    <!-- M期から右側「分裂期」枠への拡大破線 -->
                    <line x1="360" y1="238" x2="452" y2="42" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" />
                    <line x1="360" y1="312" x2="452" y2="508" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" />

                    <!-- ======== 右側：分裂期の内訳コンテナ ======== -->
                    <rect x="452" y="34" width="206" height="478" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5" />

                    <!-- 前期→中期→後期→終期 の下向き矢印 -->
                    <line x1="555" y1="205" x2="555" y2="230" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-slate)" />
                    <line x1="555" y1="297" x2="555" y2="322" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-slate)" />
                    <line x1="555" y1="389" x2="555" y2="414" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-slate)" />

                    <!-- ======== 10個のステージノード ======== -->

                    <!-- 1. 間期 (G1・S・G2の総称) -->
                    <g class="stage-node sketch-target" data-stage="interphase" transform="translate(208, 275)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-64" y="-33" width="128" height="66" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" />
                            <text class="stage-tag" x="0" y="-12" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0369A1">G₁〜G₂の総称</text>
                            <text class="stage-label" x="0" y="13" text-anchor="middle" font-size="22" font-weight="800" fill="#0C4A6E">間期</text>
                            <text class="stage-mystery" x="0" y="12" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 2. G1期 (下: スタート直後) -->
                    <g class="stage-node cycle-only" data-stage="g1" transform="translate(215, 420)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-54" y="-28" width="108" height="56" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#0369A1">G₁期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 3. S期 (左: DNA複製) -->
                    <g class="stage-node cycle-only" data-stage="s" transform="translate(72, 275)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-52" y="-28" width="104" height="56" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#0369A1">S期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 4. G2期 (上: 分裂準備) -->
                    <g class="stage-node cycle-only" data-stage="g2" transform="translate(215, 130)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-54" y="-28" width="108" height="56" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#0369A1">G₂期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 5. M期 (右: 円周上の分裂期記号) -->
                    <g class="stage-node cycle-only" data-stage="m" transform="translate(356, 275)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-50" y="-28" width="100" height="56" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#115E59">M期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 6. 分裂期 (右枠の見出し・総称) -->
                    <g class="stage-node cycle-only" data-stage="mitosis" transform="translate(555, 80)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-78" y="-28" width="156" height="56" rx="14" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5" />
                            <text class="stage-tag" x="0" y="-10" text-anchor="middle" font-size="10" font-weight="bold" fill="#0F766E">前期〜終期の総称</text>
                            <text class="stage-label" x="0" y="13" text-anchor="middle" font-size="20" font-weight="800" fill="#134E4A">分裂期</text>
                            <text class="stage-mystery" x="0" y="10" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 7. 前期 -->
                    <g class="stage-node sketch-target" data-stage="prophase" transform="translate(555, 174)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-74" y="-30" width="148" height="60" rx="15" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#134E4A">前期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 8. 中期 -->
                    <g class="stage-node sketch-target" data-stage="metaphase" transform="translate(555, 266)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-74" y="-30" width="148" height="60" rx="15" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#713F12">中期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 9. 後期 -->
                    <g class="stage-node sketch-target" data-stage="anaphase" transform="translate(555, 358)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-74" y="-30" width="148" height="60" rx="15" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#7C2D12">後期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>

                    <!-- 10. 終期 -->
                    <g class="stage-node sketch-target" data-stage="telophase" transform="translate(555, 450)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-74" y="-30" width="148" height="60" rx="15" fill="#FAF5FF" stroke="#9333EA" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#581C87">終期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>
                </svg>

                <div class="pins-layer" id="drop-zone"></div>
            </div>
        </section>

        <aside class="tray">
            <div class="tray-title">
                <span id="tray-title-text">🔄 周期リスト</span>
                <span class="tray-hint">👆タップで選択</span>
            </div>
            <div class="card-list" id="card-list"></div>
        </aside>
    </main>
</div>

<!-- トースト通知 -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- クリア時のオーバーレイ -->
<div id="clear-overlay">
    <div class="clear-message-box">
        <h1 class="clear-title" id="clear-title">🎊 素晴らしい！ 🎊</h1>
        <div class="clear-subtitle" id="clear-subtitle">体細胞分裂のすべての時期をマスターしました！</div>
        <div class="clear-actions" id="clear-actions" hidden>
            <button type="button" class="action-btn action-retry" id="retry-btn">🔄 もう一回</button>
            <button type="button" class="action-btn action-home" id="overlay-home-btn">🏠 ホームに戻る</button>
        </div>
        <div class="auto-return-text" id="auto-return-text">まもなくホーム画面に戻ります...</div>
    </div>
</div>

<script src="js/cells.js?v=20261124-3" defer></script>
<script src="js/data.js?v=20261124-3" defer></script>
<script src="js/app.js?v=20261124-3" defer></script>
</body>
</html>
