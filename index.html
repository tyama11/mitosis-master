<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>体細胞分裂マスター</title>
    <link rel="stylesheet" href="css/style.css?v=20261124-2">
</head>
<body>

<!-- ホーム画面 -->
<div id="home-screen" class="screen active">
    <div class="start-card">
        <!-- 学習モード切替タブ（上部） -->
        <div class="category-switcher" role="tablist" aria-label="学習モード選択">
            <button
                type="button"
                id="tab-sketch"
                class="category-tab active"
                role="tab"
                aria-selected="true"
                data-category="sketch"
            >
                <span>🔬 細胞スケッチで覚える</span>
                <span class="tab-score" id="tab-score-sketch" hidden></span>
            </button>
            <button
                type="button"
                id="tab-feature"
                class="category-tab"
                role="tab"
                aria-selected="false"
                data-category="feature"
            >
                <span>🧬 特徴・現象で覚える</span>
                <span class="tab-score" id="tab-score-feature" hidden></span>
            </button>
        </div>

        <h1>体細胞分裂マスター 🔬</h1>
        <p class="desc" id="home-desc">
            細胞の観察スケッチを選んで、細胞周期の正しい時期（間期・前期・中期・後期・終期）に配置しよう！
        </p>

        <div class="rules" id="home-rules">
            <div class="rule-item">
                <span class="rule-icon">🔰</span>
                <div><b>かんたん</b>：見分け方のヒントと色分けが表示されます</div>
            </div>
            <div class="rule-item">
                <span class="rule-icon">🧪</span>
                <div><b>ふつう</b>：ヒント・色が消滅！白黒スケッチや文章だけで判別するモード</div>
            </div>
            <div class="rule-item" id="rule-oni-item" hidden>
                <span class="rule-icon">👹</span>
                <div id="rule-oni-text"><b>おに</b>：60秒タイムアタック（ミスで-5秒）！図の時期名も隠れます</div>
            </div>
        </div>

        <div class="mode-buttons">
            <button type="button" class="mode-btn btn-easy" data-difficulty="easy">🔰 かんたんでスタート</button>
            <button type="button" class="mode-btn btn-normal" data-difficulty="normal">🧪 ふつうでスタート</button>
            <button type="button" class="mode-btn btn-oni" id="btn-oni" data-difficulty="oni" hidden>👹 おにでスタート</button>
        </div>
    </div>
</div>

<!-- ゲーム画面 -->
<div id="game-screen" class="screen">
    <header class="header">
        <button type="button" class="reset-btn" id="home-btn">
            <span class="reset-icon">🏠</span> ホーム
        </button>

        <div class="progress-container" id="progress-container">
            <div class="timer-badge" id="timer-badge" hidden>⏱️ <span id="timer-text">60</span>秒</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="score-text" id="score-text"><span id="score">0</span>/<span id="total-questions">10</span></div>
        </div>

        <div class="mode-display" id="mode-display">🔬 細胞スケッチ / 🔰 かんたん</div>
    </header>

    <main class="main">
        <section class="graph-container">
            <div class="graph-wrapper" id="graph-wrapper">
                <!-- 細胞周期（間期＋分裂期4つ）のインタラクティブ図 -->
                <svg
                    id="cycle-svg"
                    viewBox="0 0 600 540"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="細胞周期と体細胞分裂の5時期"
                >
                    <defs>
                        <marker id="cycle-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748B" />
                        </marker>
                        <marker id="interphase-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0EA5E9" />
                        </marker>
                    </defs>

                    <!-- 背景ガイド円 -->
                    <ellipse cx="300" cy="280" rx="185" ry="175" fill="none" stroke="#E2E8F0" stroke-width="14" />

                    <!-- 分裂期（M期）の外側ガイド弧 -->
                    <path
                        class="mitosis-arc"
                        d="M 522 182 A 235 225 0 1 1 78 182"
                        fill="none"
                        stroke="#CBD5E1"
                        stroke-width="3"
                        stroke-dasharray="7 6"
                    />
                    <g class="stage-guide-text">
                        <rect x="242" y="500" width="116" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" />
                        <text x="300" y="518" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">分裂期（M期）</text>
                    </g>

                    <!-- 時計回りの進行矢印（5区間） -->
                    <!-- ① 間期 → ② 前期 -->
                    <path d="M 388 122 A 185 175 0 0 1 456 178" fill="none" stroke="#0EA5E9" stroke-width="4" marker-end="url(#interphase-arrow)" />
                    <!-- ② 前期 → ③ 中期 -->
                    <path d="M 476 276 A 185 175 0 0 1 446 376" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#cycle-arrow)" />
                    <!-- ③ 中期 → ④ 後期 -->
                    <path d="M 342 444 A 185 175 0 0 1 258 444" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#cycle-arrow)" />
                    <!-- ④ 後期 → ⑤ 終期 -->
                    <path d="M 154 376 A 185 175 0 0 1 124 276" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#cycle-arrow)" />
                    <!-- ⑤ 終期 → ① 間期（分裂完了して娘細胞へ） -->
                    <path d="M 144 178 A 185 175 0 0 1 212 122" fill="none" stroke="#64748B" stroke-width="3.5" marker-end="url(#cycle-arrow)" />

                    <!-- ⑤→① の基準マーカー（おにモードでも周期の起点が分かる目印） -->
                    <g transform="translate(158, 134)">
                        <rect x="-46" y="-13" width="92" height="24" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5" />
                        <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#0E7490">分裂完了・成長へ</text>
                    </g>

                    <!-- 中央ラベル -->
                    <circle cx="300" cy="280" r="68" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
                    <text x="300" y="274" text-anchor="middle" font-size="18" font-weight="800" fill="#334155">細胞周期</text>
                    <text x="300" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">時計回りに進行 ↻</text>

                    <!-- ① 間期 -->
                    <g class="stage-node stage-interphase" data-stage="interphase" transform="translate(300, 105)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-86" y="-42" width="172" height="84" rx="18" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5" />
                            <text class="stage-num" x="0" y="-16" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369A1">STAGE ①</text>
                            <text class="stage-label" x="0" y="10" text-anchor="middle" font-size="22" font-weight="800" fill="#0C4A6E">間期</text>
                            <text class="stage-mystery" x="0" y="12" text-anchor="middle" font-size="22" font-weight="800" fill="#334155">？ (①)</text>
                            <text class="stage-sub" x="0" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284C7">G₁ → S(DNA複製) → G₂</text>
                        </g>
                    </g>

                    <!-- ② 前期 -->
                    <g class="stage-node stage-prophase" data-stage="prophase" transform="translate(476, 226)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-72" y="-40" width="144" height="80" rx="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5" />
                            <text class="stage-num" x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F766E">STAGE ②</text>
                            <text class="stage-label" x="0" y="10" text-anchor="middle" font-size="21" font-weight="800" fill="#134E4A">前期</text>
                            <text class="stage-mystery" x="0" y="12" text-anchor="middle" font-size="21" font-weight="800" fill="#334155">？ (②)</text>
                            <text class="stage-sub" x="0" y="29" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D9488">染色体出現・核膜消失</text>
                        </g>
                    </g>

                    <!-- ③ 中期 -->
                    <g class="stage-node stage-metaphase" data-stage="metaphase" transform="translate(409, 422)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-72" y="-40" width="144" height="80" rx="18" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2.5" />
                            <text class="stage-num" x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#A16207">STAGE ③</text>
                            <text class="stage-label" x="0" y="10" text-anchor="middle" font-size="21" font-weight="800" fill="#713F12">中期</text>
                            <text class="stage-mystery" x="0" y="12" text-anchor="middle" font-size="21" font-weight="800" fill="#334155">？ (③)</text>
                            <text class="stage-sub" x="0" y="29" text-anchor="middle" font-size="11" font-weight="bold" fill="#CA8A04">赤道面に一列整列</text>
                        </g>
                    </g>

                    <!-- ④ 後期 -->
                    <g class="stage-node stage-anaphase" data-stage="anaphase" transform="translate(191, 422)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-72" y="-40" width="144" height="80" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5" />
                            <text class="stage-num" x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2410C">STAGE ④</text>
                            <text class="stage-label" x="0" y="10" text-anchor="middle" font-size="21" font-weight="800" fill="#7C2D12">後期</text>
                            <text class="stage-mystery" x="0" y="12" text-anchor="middle" font-size="21" font-weight="800" fill="#334155">？ (④)</text>
                            <text class="stage-sub" x="0" y="29" text-anchor="middle" font-size="11" font-weight="bold" fill="#EA580C">両極へ移動</text>
                        </g>
                    </g>

                    <!-- ⑤ 終期 -->
                    <g class="stage-node stage-telophase" data-stage="telophase" transform="translate(124, 226)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-72" y="-40" width="144" height="80" rx="18" fill="#FAF5FF" stroke="#9333EA" stroke-width="2.5" />
                            <text class="stage-num" x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#7E22CE">STAGE ⑤</text>
                            <text class="stage-label" x="0" y="10" text-anchor="middle" font-size="21" font-weight="800" fill="#581C87">終期</text>
                            <text class="stage-mystery" x="0" y="12" text-anchor="middle" font-size="21" font-weight="800" fill="#334155">？ (⑤)</text>
                            <text class="stage-sub" x="0" y="29" text-anchor="middle" font-size="11" font-weight="bold" fill="#9333EA">細胞板・くびれ形成</text>
                        </g>
                    </g>
                </svg>

                <div class="pins-layer" id="drop-zone"></div>
            </div>
        </section>

        <aside class="tray">
            <div class="tray-title">
                <span id="tray-title-text">🔬 細胞スケッチ</span>
                <span class="tray-hint">👆タップで選択</span>
            </div>
            <div class="card-list" id="card-list"></div>
        </aside>
    </main>
</div>

<!-- トースト通知 -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- クリア時のオーバーレイ -->
<div id="clear-overlay">
    <div class="clear-message-box">
        <h1 class="clear-title" id="clear-title">🎊 素晴らしい！ 🎊</h1>
        <div class="clear-subtitle" id="clear-subtitle">体細胞分裂のすべての時期をマスターしました！</div>
        <div class="clear-actions" id="clear-actions" hidden>
            <button type="button" class="action-btn action-retry" id="retry-btn">🔄 もう一回</button>
            <button type="button" class="action-btn action-home" id="overlay-home-btn">🏠 ホームに戻る</button>
        </div>
        <div class="auto-return-text" id="auto-return-text">まもなくホーム画面に戻ります...</div>
    </div>
</div>

<script src="js/cells.js?v=20261124-2" defer></script>
<script src="js/data.js?v=20261124-2" defer></script>
<script src="js/app.js?v=20261124-2" defer></script>
</body>
</html>
