<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体細胞分裂マスター</title>
    <link rel="stylesheet" href="css/style.css?v=20261127-1">
</head>
<body>

<!-- ホーム画面（全画面・横長レイアウト。内側の小窓やスクロール枠はなし） -->
<div id="home-screen" class="screen active">
    <header class="home-top-bar">
        <!-- 学習モード切替タブ（上部） -->
        <div class="category-switcher" role="tablist" aria-label="学習モード選択">
            <button
                type="button"
                id="tab-cycle"
                class="category-tab active"
                role="tab"
                aria-selected="true"
                data-category="cycle"
            >
                <span>🔄 細胞周期で覚える</span>
                <span class="tab-score" id="tab-score-cycle" hidden></span>
            </button>
            <button
                type="button"
                id="tab-sketch"
                class="category-tab"
                role="tab"
                aria-selected="false"
                data-category="sketch"
            >
                <span>🔬 細胞スケッチで覚える</span>
                <span class="tab-score" id="tab-score-sketch" hidden></span>
            </button>
        </div>
        <button type="button" class="mute-btn" id="home-mute-btn" aria-label="効果音のオン・オフ">🔊 音ON</button>
    </header>

    <main class="home-body">
        <section class="home-info">
            <h1>体細胞分裂マスター 🔬</h1>
            <div class="earned-title-banner" id="earned-title-banner" hidden></div>
            <p class="desc" id="home-desc">
                カードを選んで、細胞周期の正しい位置に当てはめよう！
            </p>

            <ul class="rules" id="home-rules">
                <li class="rule-item">
                    <span class="rule-icon" aria-hidden="true">🔰</span>
                    <div><b>かんたん</b>：一直線の図 ＋ 特徴の説明つき</div>
                </li>
                <li class="rule-item">
                    <span class="rule-icon" aria-hidden="true">🧪</span>
                    <div id="rule-normal-text"><b>ふつう</b>：円の周期図（説明なし）</div>
                </li>
                <li class="rule-item" id="rule-oni-item" hidden>
                    <span class="rule-icon" aria-hidden="true">👹</span>
                    <div id="rule-oni-text"><b>おに</b>：60秒TA（ミス-5秒／5連続正解で+3秒）</div>
                </li>
            </ul>
        </section>

        <section class="home-actions" aria-label="難易度を選んでスタート">
            <div class="mode-buttons">
                <button type="button" class="mode-btn btn-easy" data-difficulty="easy">🔰 かんたんでスタート</button>
                <button type="button" class="mode-btn btn-normal" data-difficulty="normal">🧪 ふつうでスタート</button>
                <button type="button" class="mode-btn btn-oni" id="btn-oni" data-difficulty="oni" hidden>👹 おにでスタート</button>
            </div>
            <p class="kbd-help">
                <span class="kbd-line">⌨️ <kbd>Tab</kbd> 移動　<kbd>Enter</kbd> 決定　<kbd>Esc</kbd> 選択解除</span>
                <span class="kbd-line">👹 おには <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> キーでそのまま回答</span>
            </p>
        </section>
    </main>
</div>

<!-- ゲーム画面 -->
<div id="game-screen" class="screen">
    <header class="header">
        <button type="button" class="reset-btn" id="home-btn">
            <span class="reset-icon" aria-hidden="true">🏠</span> ホーム
        </button>

        <div class="progress-container" id="progress-container">
            <div class="timer-badge" id="timer-badge" hidden>⏱️ <span id="timer-text">60</span>秒</div>
            <div class="combo-badge" id="combo-badge" hidden>🔥 2 COMBO</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="score-text" id="score-text"><span id="score">0</span>/<span id="total-questions">10</span></div>
        </div>

        <div class="header-right">
            <div class="mode-display" id="mode-display">🔄 細胞周期 / 🔰 かんたん</div>
            <button type="button" class="mute-btn" id="game-mute-btn" aria-label="効果音のオン・オフ">🔊</button>
        </div>
    </header>

    <main class="main">
        <section class="graph-container">

                <!-- ======== かんたん用：一直線の図 ======== -->

                    <line x1="158" y1="268" x2="158" y2="228" stroke="#94A3B8" stroke-width="2.5" />

                    <!-- M期＝分裂期 の括弧ライン (前期・中期・後期・終期) -->
                    <path d="M 314 302 L 314 268 L 674 268 L 674 302" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round" />

                    <line x1="391" y1="340" x2="403" y2="340" stroke="#64748B" stroke-width="2.5" marker-end="url(#lin-arrow)" />

                    </g>

                            <rect class="stage-box" x="-40" y="-28" width="80" height="56" rx="13" fill="#FAF5FF" stroke="#9333EA" stroke-width="2.5" />

                <!-- ======== ふつう・おに用：円の周期図 ======== -->

                    id="circle-svg"
                    class="board-svg"
                    viewBox="0 0 700 540"

                        stroke="#CBD5E1"

                    <!-- 分裂期（＝M期）から右側4段階枠への拡大破線 -->

                    <g class="stage-node sketch-target" data-stage="telophase" data-accept="telophase" data-default-label="終期" transform="translate(612, 438)">
                        <g class="stage-visual">
                            <rect class="stage-box" x="-64" y="-30" width="128" height="60" rx="15" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5" />
                            <text class="stage-label" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">終期</text>
                            <text class="stage-mystery" x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">？</text>
                        </g>
                    </g>
                </svg>

                <!-- ======== おに用：ランダム回転・シフト＆1箇所だけ空欄「？」の図 ======== -->
                <svg
                    id="oni-cycle-svg"
                    class="board-svg"
                    viewBox="0 0 700 540"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="おにモードの細胞周期問題図"
                ></svg>

                <div class="pins-layer" id="drop-zone"></div>
            </div>
        </section>

        <aside class="tray">
            <div class="tray-title">
                <span id="tray-title-text">🔄 周期カード</span>
                <span class="tray-hint" id="tray-hint">👆クリックで選択</span>
            </div>
            <div class="card-list" id="card-list" role="list" aria-label="カード一覧"></div>
        </aside>
    </main>
</div>

<!-- トースト通知 -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- クリア時のオーバーレイ -->
<div id="clear-overlay">
    <div class="clear-message-box">
        <h1 class="clear-title" id="clear-title">🎊 素晴らしい！ 🎊</h1>
        <div class="clear-subtitle" id="clear-subtitle">細胞周期と体細胞分裂をマスターしました！</div>
        <div class="clear-actions" id="clear-actions" hidden>
            <button type="button" class="action-btn action-retry" id="retry-btn">🔄 もう一回</button>
            <button type="button" class="action-btn action-home" id="overlay-home-btn">🏠 ホームに戻る</button>
        </div>
        <div class="auto-return-text" id="auto-return-text">まもなくホーム画面に戻ります...</div>
    </div>
</div>

<script type="module" src="js/app.js?v=20261127-1"></script>
</body>
</html>
